<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap5</title>
    <!--bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--jquerry(google CDN)-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  
</head>
<body>

    <div class="container mt-5">

<div class="col-md-3 mb-3">

<div class="list-group">

<a href="#" class="list-group-item list-group-item-action active">FUNCIONARIO</a>
<a href="#" class="list-group-item list-group-item-action">DADOS</a>
<a href="#" class="list-group-item list-group-item-action">PAGAMENTO</a>
</div>
</div><!--fecha col 3-->

<div class="col-9">
 <form action="formfuncionario">

<div class="card border-info mb-4">

<div class="card-header bg-info text-white">
<h5>Novo funcionario</h5>

</div><!--fecha card header-->

<div class="card-body">

<div class="alert alert-info">
Preencha os campos do formulário abaixo:
</div>
<div class="row">
<div class="col-12 mb-3">
    <label for="nome" class="form-label">nome:</label>
    <input type="text" class="form-control" id="nome" name="nome" required placeholder="digite aqui seu nome">
</div><!--fecha col 12-->

<div class="col-6 mb-3">
    <label for="e-mail" class="form-label">e-mail:</label>
    <input type="e-mail" class="form-control" id="e-mail" name="e-mail" required placeholder ="digite aqui seu e-mail">
</div><!--fecha col6-->

<div class="col-6 mb-3">
    <label for="salario" class="form-label">salario:</label>
    <input type="salario" class="form-control" id="salario" name="salario" required placeholder ="digite aqui sua pretenção de salario">
</div><!--fecha col6.2-->

<div class="col-6 mb-3">
   <label for="estado" class="form-label">estado:</label>
   <select name="estado" id="estado" class="form-control">
<option value="#">estados:</option>
<hr class="form-divider">
<option value="RJ">RJ</option>
<hr class="form-divider">
<option value="SP">SP</option>
<hr class="form-divider">
<option value="MG">MG</option>

   </select>
</div><!--fecha col6.3-->

<div class="col-6 mb-3">
    <label for="estado" class="form-label">cidade</label>
    <select name="cidade" id="cidade" class="form-control">
 <option value="#">cidades:</option>
    <hr class="form-divider">
    <option value="RJ">Rio de janeiro</option>
    <hr class="form-divider">
    <option value="SP">São paulo</option>
    <hr class="form-divider">
    <option value="MG">Belo horizonte</option>
    
 
    </select>


</div><!--fecha row-->

</div><!--fecha card body-->
<div class="card-footer text-end">
<button type="submit" class="btn btn-primary btnenviar">
    Enviar
</button>


</div><!--fechar footer-->







</div> <!--fecha  border card-->

 </form>

</div><!--fecha col 9-->



    </div> <!--fecha container-->





    <!--bootsrap 5 js bundle( inclue popper)-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
