<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="container  mt-4">
    <div class="container-fluid">
  <header class="bg-primary text-white text-center py-4 mb-4">
    <h1>🎯 Sistema de Gestão de Alunos</h1>
    <p class="mb-0">Agora com formulário!</p>
  </header>

  <div class="container">
    <div class="row">
      <div class="col-md-4">
        <app-aluno-form 
          [aluno]="aluno()" 
          (onSubmit)="adicionarAluno()">
        </app-aluno-form>
      </div>
      
      <div class="col-md-8">
        <app-aluno-list [alunos]="alunos"></app-aluno-list>
      </div>
    </div>
  </div>
</div>
  </div><!--fecha o container do bootstrap-->

</body>

</html>
