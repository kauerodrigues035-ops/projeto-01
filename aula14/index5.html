<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contas</title>
</head>

<body>
    <form action="">
        <button onclick="contar()">contar</button>
    </form>

    <script>
        function contar() {

            var count = 1;
            while (count <= 10) {
                document.writeln(count + "<br/>")

                count++;

            };

        };;


    </script>




</body>

</html>
